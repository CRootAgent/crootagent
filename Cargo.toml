[package]
name = "crootagent"
version = "0.1.0"
edition = "2021"
authors = ["Ahmad Zakky Nurfauzan <ahmadzakky2862@gmail.com>"]
description = "Ultra-lightweight CLI coding agent with multi-API session management and developer tool execution"
license = "GPL-3.0"
repository = "https://github.com/CRootAgent/crootagent"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
rustyline = "14.0"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
anyhow = "1.0"
async-trait = "0.1"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
